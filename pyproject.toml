[project]
name = "callbridge"
version = "0.1.0"
description = "Turn your iPhone number into an AI phone agent: an ElevenLabs voice agent makes and answers real calls through your Mac."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Itai Boublil" }]
keywords = ["voice-agent", "ai-receptionist", "elevenlabs", "iphone", "macos", "phone-calls", "crm", "claude-code"]
classifiers = [
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Telephony",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "elevenlabs>=2.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
callbridge = "callbridge.cli:main"

[project.urls]
Homepage = "https://github.com/Digitaicoil/callbridge"
Issues = "https://github.com/Digitaicoil/callbridge/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["callbridge"]

[tool.hatch.build.targets.wheel.force-include]
"agents" = "agents"
"scripts" = "scripts"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "B023", "UP045", "UP007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
