name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never paste API keys, tokens, phone numbers or transcripts with personal data."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `callbridge doctor`
      render: text
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
    validations:
      required: true
  - type: input
    id: iphone
    attributes:
      label: iPhone model and iOS version
  - type: dropdown
    id: direction
    attributes:
      label: Call direction
      options: [outbound, inbound, both, not call-related]
  - type: textarea
    id: log
    attributes:
      label: Terminal output (redact numbers)
      render: text
